services:
  db:
    image: postgres:16-alpine
    container_name: agrismart-postgres
    environment:
      POSTGRES_DB: agrismart
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - agrismart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  agrismart-postgres-data:

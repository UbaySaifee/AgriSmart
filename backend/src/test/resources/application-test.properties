spring.datasource.url=jdbc:h2:mem:agrismart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.secret-key=test-only-jwt-secret-key-with-at-least-32-bytes
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=http://localhost:5173
app.weather.base-url=https://api.open-meteo.com
app.weather.connect-timeout-ms=1000
app.weather.read-timeout-ms=1000
app.catalog.seed=true
